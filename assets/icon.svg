<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#6D28D9"/>

  <!-- Card body -->
  <rect x="148" y="296" width="728" height="456" rx="72" fill="white" opacity="0.12"/>

  <!-- Card top stripe -->
  <rect x="148" y="296" width="728" height="130" rx="72" fill="white" opacity="0.18"/>
  <rect x="148" y="366" width="728" height="60" fill="white" opacity="0.18"/>

  <!-- Chip -->
