  <circle cx="262" cy="648" r="14" fill="white" opacity="0.5"/>
  <circle cx="300" cy="648" r="14" fill="white" opacity="0.5"/>
  <circle cx="338" cy="648" r="14" fill="white" opacity="0.5"/>
  <circle cx="404" cy="648" r="14" fill="white" opacity="0.25"/>
  <circle cx="442" cy="648" r="14" fill="white" opacity="0.25"/>
  <circle cx="480" cy="648" r="14" fill="white" opacity="0.25"/>
  <circle cx="518" cy="648" r="14" fill="white" opacity="0.25"/>
</svg>
